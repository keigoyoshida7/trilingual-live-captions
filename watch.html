<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <meta name="google" content="notranslate">
  <title>Live Captions · 字幕視聴</title>
  <link rel="stylesheet" href="./styles.css?v=8">
  <script type="module" src="./watch.mjs?v=1"></script>
</head>
<body class="watch-view" data-caption-language="ja">
  <header class="toolbar">
    <div class="identity">
      <h1 lang="en">Live Captions</h1>
      <div id="status" class="status" role="status" data-state="idle">
        <span class="light" aria-hidden="true"></span>
        <span id="status-text">接続中…</span>
      </div>
    </div>
    <div class="controls">
      <button id="watch-retry" class="share-button" type="button" hidden>再接続</button>
    </div>
  </header>

  <main class="stage" aria-label="3言語の字幕">
    <div class="watch-languages" id="watch-languages" role="group" aria-label="表示言語">
      <button lang="ja" data-language="ja" type="button" aria-pressed="true">日本語</button>
      <button lang="en" data-language="en" type="button" aria-pressed="false">English</button>
      <button lang="fr" data-language="fr" type="button" aria-pressed="false">Français</button>
    </div>
    <div class="language-headings columns" id="language-headings">
      <h2 lang="ja" data-language="ja">日本語</h2>
      <h2 lang="en" data-language="en">English</h2>
      <h2 lang="fr" data-language="fr">Français</h2>
    </div>
    <div id="viewport" class="viewport" tabindex="0" aria-label="字幕履歴">
      <div id="captions" class="captions" role="list" aria-label="発話順の字幕"></div>
      <p id="empty" class="empty">配信者に接続しています。</p>
    </div>
    <button id="follow" class="follow" type="button" hidden>最新の字幕 ↓</button>
  </main>
  <noscript>このページの利用には JavaScript が必要です。</noscript>
</body>
</html>
